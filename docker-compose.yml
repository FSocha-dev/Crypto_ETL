version: '3.8'

services:
  redis:
    image: redis:8.2.2
    container_name: redis_8.2.2
    command: ["redis-server","--appendonly","yes","--save","60","1000"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:17.2
    container_name: postgres_17.2
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow:
    image: apache/airflow:2.11.0-python3.12
    container_name: airflow_2.11.0
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__AUTHENTICATE: "True"
      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: 0.0.0.0
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: 8080
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/requirements.txt:/opt/airflow/requirements.txt
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: >
      bash -c "
        pip install --no-cache-dir -r /opt/airflow/requirements.txt &&
        airflow db upgrade &&
        if ! airflow users list | awk '{print $1}' | grep -qx \"${AIRFLOW_ADMIN_USER}\"; then
          airflow users create --role Admin --username \"${AIRFLOW_ADMIN_USER}\" --password \"${AIRFLOW_ADMIN_PASSWORD}\" --email \"${AIRFLOW_ADMIN_EMAIL}\" --firstname \"${AIRFLOW_ADMIN_FIRSTNAME}\" --lastname \"${AIRFLOW_ADMIN_LASTNAME}\";
        fi
        
        (while true; do airflow scheduler; echo 'scheduler crashed, restarting in 5s'; sleep 5; done) &
        trap 'kill 0' TERM INT

        exec airflow webserver
      "
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: prometheus_v3.6.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0-18209090404
    container_name: grafana_12.3.0
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  redis_data:
